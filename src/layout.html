<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:type" content="website">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to the text</a>
  <header class="site">
    <a class="name" href="/">any table</a>
    <nav aria-label="Site">
        {{nav}}
    </nav>
  </header>
  <main id="main">
{{body}}
  </main>
  <footer class="site">
    <p>{{meta}}</p>
    <p>No revelation, no buildings, no collection. The original prose is dedicated to the public domain under <a href="/license/">CC0</a>. Every revision is made in the open on <a href="https://github.com/any-table/anytable">GitHub</a>.</p>
  </footer>
</body>
</html>
